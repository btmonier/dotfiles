# Agent/CI shells export NO_COLOR=1 and FORCE_COLOR=0. If the server is ever started
# from one, every pane and popup inherits them and TUIs like lazygit render monochrome.
set-environment -gr NO_COLOR
set-environment -gr FORCE_COLOR
set-environment -gu LS_COLORS
set-environment -gu LSCOLORS

# Truecolor: tmux-256color advertises only 256 colors to programs inside tmux, so
# name the outer terminals that can actually take 24-bit output.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Catppuccin statusline locally; gruvbox-material on any remote SSH session.
if-shell 'test -n "$SSH_CONNECTION" -o -n "$SSH_CLIENT"' \
  'source-file ~/.config/tmux/statusline-remote.conf' \
  'source-file ~/.config/tmux/statusline.conf'
source-file ~/.config/tmux/keybindings.conf

# Make windows hoverable
set -g mouse on

# Plugins live outside the repo, since ~/.config/tmux is a symlink into it.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'yazi lazygit btop'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run "$HOME/.local/share/tmux/plugins/tpm/tpm"
