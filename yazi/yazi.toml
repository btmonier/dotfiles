[opener]
edit = [
  { run = '${EDITOR:-nvim} %s', block = true, for = "unix" },
]

browser = [
  { run = 'open -a "Firefox" %s', orphan = true, desc = "Open in Firefox", for = "macos" },
  { run = "xdg-open %s",          orphan = true, desc = "Open in browser", for = "linux" },
]

preview = [
  { run = 'open -a "Preview" %s', orphan = true, desc = "Open in Preview", for = "macos" },
]

rstudio = [
  { run = 'open -a "RStudio" %s', orphan = true, desc = "Open in RStudio", for = "macos" }
]

inkscape = [
  { run = 'open -a "inkscape" %s', orphan = true, desc = "Open in Inkscape", for = "macos" }
]

vlc = [
  { run = 'open -a "VLC" %s', orphan = true, desc = "Open in VLC", for = "macos" },
  { run = "vlc %s",           orphan = true, desc = "Open in VLC", for = "linux" },
]

guitarpro = [
  { run = 'open -a "Guitar Pro 8" %s', orphan = true, desc = "Open in Guitar Pro", for = "macos" },
]

extract = [
  { run = "extract %s", block = true, desc = "Extract here" },
]

[open]
prepend_rules = [
  { url = "*.r",    use = [ "edit",    "rstudio" ] },
  { url = "*.html", use = [ "browser", "edit"    ] },
  { url = "*.htm",  use = [ "browser", "edit"    ] },
  { url = "*.gif",  use = [ "browser", "preview" ] },
  { url = "*.svg",  use = [ "inkscape", "edit", "browser" ] },

  { url = "*.mp4",  use = [ "vlc", "browser" ] },
  { url = "*.webm", use = [ "vlc", "browser" ] },
  { url = "*.mkv",  use = "vlc" },
  { url = "*.mov",  use = [ "vlc", "preview" ] },
  { url = "*.avi",  use = "vlc" },
  { url = "*.wmv",  use = "vlc" },
  { url = "*.flv",  use = "vlc" },
  { url = "*.m4v",  use = [ "vlc", "preview" ] },
  { url = "*.mpg",  use = "vlc" },
  { url = "*.mpeg", use = "vlc" },
  { url = "*.m2ts", use = "vlc" },
  { url = "*.ogv",  use = [ "vlc", "browser" ] },
  { url = "*.3gp",  use = "vlc" },

  { url = "*.gp",       use = "guitarpro" },
  { url = "*.gpx",      use = [ "guitarpro", "edit" ] },
  { url = "*.gp5",      use = "guitarpro" },
  { url = "*.gp4",      use = "guitarpro" },
  { url = "*.gp3",      use = "guitarpro" },
  { url = "*.gtp",      use = "guitarpro" },
  { url = "*.mxl",      use = "guitarpro" },
  { url = "*.musicxml", use = [ "guitarpro", "edit" ] },
  { url = "*.tef",      use = "guitarpro" },
  { url = "*.ptb",      use = "guitarpro" },
  { url = "*.tab",      use = [ "guitarpro", "edit" ] },
  { url = "*.btab",     use = [ "guitarpro", "edit" ] },

  { url = "*.zip",     use = "extract" },
  { url = "*.tar",     use = "extract" },
  { url = "*.tar.gz",  use = "extract" },
  { url = "*.tgz",     use = "extract" },
  { url = "*.tar.bz2", use = "extract" },
  { url = "*.tbz2",    use = "extract" },
  { url = "*.tar.xz",  use = "extract" },
  { url = "*.txz",     use = "extract" },
  { url = "*.tar.zst", use = "extract" },
  { url = "*.7z",      use = "extract" },
  { url = "*.rar",     use = "extract" },
  { url = "*.gz",      use = "extract" },
  { url = "*.bz2",     use = "extract" },
  { url = "*.xz",      use = "extract" },
  { url = "*.zst",     use = "extract" },
]
